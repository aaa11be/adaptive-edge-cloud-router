[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-edge-cloud-router"
version = "0.1.0"
description = "A reproducible research scaffold for adaptive local-cloud AI inference routing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Project Author" }]
dependencies = [
  "pydantic>=2.8,<3",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
]

[project.scripts]
edge-cloud-smoke = "edge_cloud_router.evaluation.smoke_benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["edge_cloud_router"]
